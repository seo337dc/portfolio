<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard','Apple SD Gothic Neo','Noto Sans KR',Roboto,sans-serif">
  <!-- BEFORE PANEL -->
  <rect x="0" y="0" width="1000" height="200" rx="14" fill="#fef2f2"/>
  <rect x="24" y="20" width="72" height="26" rx="13" fill="#dc2626"/>
  <text x="60" y="37" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">BEFORE</text>
  <text x="106" y="38" font-size="14" font-weight="600" fill="#7f1d1d">UI 조작 방식 — 여러 단계를 거쳐야 작업 완료</text>

  <!-- BEFORE boxes -->
  <g font-size="13" fill="#ffffff">
    <rect x="32" y="90" width="150" height="72" rx="10" fill="#1f2937"/>
    <text x="107" y="122" text-anchor="middle" font-weight="700">사용자</text>
    <text x="107" y="142" text-anchor="middle" font-size="11" fill="#d1d5db">작업 필요 인지</text>

    <rect x="222" y="90" width="230" height="72" rx="10" fill="#1f2937"/>
    <text x="337" y="118" text-anchor="middle" font-weight="700">클릭 · 폼 입력 · 필터링</text>
    <text x="337" y="138" text-anchor="middle" font-size="11" fill="#d1d5db">여러 단계의 반복 조작</text>
    <text x="337" y="154" text-anchor="middle" font-size="11" fill="#fca5a5">단계마다 이벤트 핸들러 발생</text>

    <rect x="492" y="90" width="200" height="72" rx="10" fill="#1f2937"/>
    <text x="592" y="122" text-anchor="middle" font-weight="700">페이지 이벤트 핸들러</text>
    <text x="592" y="142" text-anchor="middle" font-size="11" fill="#d1d5db">페이지마다 각각 존재</text>

    <rect x="732" y="90" width="236" height="72" rx="10" fill="#1f2937"/>
    <text x="850" y="122" text-anchor="middle" font-weight="700">작업 완료</text>
    <text x="850" y="142" text-anchor="middle" font-size="11" fill="#d1d5db">여기까지 여러 클릭 소요</text>
  </g>

  <g stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#arrowRed)">
    <path d="M182 126 L222 126"/>
    <path d="M452 126 L492 126"/>
    <path d="M692 126 L732 126"/>
  </g>

  <!-- AFTER PANEL -->
  <rect x="0" y="228" width="1000" height="232" rx="14" fill="#f0fdf4"/>
  <rect x="24" y="248" width="64" height="26" rx="13" fill="#16a34a"/>
  <text x="56" y="265" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">AFTER</text>
  <text x="98" y="266" font-size="14" font-weight="600" fill="#14532d">자연어 인터페이스 — 대화 한 번으로 작업 완료</text>

  <!-- AFTER boxes -->
  <g font-size="13" fill="#ffffff">
    <rect x="32" y="318" width="130" height="76" rx="10" fill="#1f2937"/>
    <text x="97" y="352" text-anchor="middle" font-weight="700">사용자</text>
    <text x="97" y="372" text-anchor="middle" font-size="11" fill="#bbf7d0">"OO 신청 등록해줘"</text>

    <rect x="192" y="318" width="190" height="76" rx="10" fill="#1f2937" stroke="#22c55e" stroke-width="2"/>
    <text x="287" y="345" text-anchor="middle" font-weight="700">Grok API</text>
    <text x="287" y="365" text-anchor="middle" font-size="11" fill="#bbf7d0">자연어 → 의도·파라미터</text>
    <text x="287" y="381" text-anchor="middle" font-size="11" fill="#bbf7d0">해석</text>

    <rect x="412" y="318" width="220" height="76" rx="10" fill="#1f2937"/>
    <text x="522" y="345" text-anchor="middle" font-weight="700">기존 페이지 API 호출</text>
    <text x="522" y="365" text-anchor="middle" font-size="11" fill="#bbf7d0">이미 구축된 API 재사용</text>
    <text x="522" y="381" text-anchor="middle" font-size="11" fill="#bbf7d0">(UI 대체 아님)</text>

    <rect x="662" y="318" width="180" height="76" rx="10" fill="#1f2937"/>
    <text x="752" y="352" text-anchor="middle" font-weight="700">결과 반영</text>
    <text x="752" y="372" text-anchor="middle" font-size="11" fill="#bbf7d0">채팅으로 완료 안내</text>

    <rect x="872" y="318" width="96" height="76" rx="10" fill="#16a34a"/>
    <text x="920" y="352" text-anchor="middle" font-weight="800">완료</text>
    <text x="920" y="370" text-anchor="middle" font-size="10" fill="#dcfce7">한 번의 대화</text>
  </g>

  <g stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrowGreen)">
    <path d="M162 356 L192 356"/>
    <path d="M382 356 L412 356"/>
    <path d="M632 356 L662 356"/>
    <path d="M842 356 L872 356"/>
  </g>

  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
  </defs>
</svg>
